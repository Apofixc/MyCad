[workspace]
members = ["crates/mycad-core"]

[package]
name = "mycad"
version = "0.1.0"
description = "MyCad — CAD для реверс-инжиниринга и ремонта печатных плат"
edition = "2021"

[lib]
name = "mycad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mycad-core = { path = "crates/mycad-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
